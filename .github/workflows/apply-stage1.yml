name: Apply stage1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply zip
        run: |
          unzip -o V2rayNG/v2rayng-stage1-login.zip -d .
          rm V2rayNG/v2rayng-stage1-login.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply stage1 login" || echo "nothing to commit"
          git push
          
